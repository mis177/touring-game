name: touring_game
description: "A location-based touring game built with Flutter and Firebase."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cloud_firestore: ^4.14.0
  equatable: ^2.0.5
  firebase_auth: ^4.15.3
  firebase_core: ^2.24.2
  firebase_storage: ^11.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_map: ^6.1.0
  flutter_map_location_marker: ^8.0.2
  geolocator: ^10.1.0
  go_router: ^16.3.0
  http: ^1.1.2
  image_picker: ^1.0.7
  latlong2: ^0.9.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.3
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - lib/images/
